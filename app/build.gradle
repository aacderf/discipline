plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def signingProperties = new Properties()
def signingFile = rootProject.file('keystore.properties')
if(signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def amapProperties = new Properties()
def amapFile = rootProject.file('amap.properties')
if(amapFile.exists()) amapFile.withInputStream { amapProperties.load(it) }
def amapKey = (System.getenv('AMAP_API_KEY') ?: amapProperties['key'] ?: '').toString().trim()
android {
    namespace 'com.hl.discipline'
    compileSdk 37
    defaultConfig {
        applicationId 'com.hl.discipline'
        minSdk 26
        targetSdk 36
        versionCode 41
        versionName '0.11.6'
        manifestPlaceholders = [AMAP_KEY: amapKey]
        buildConfigField 'boolean', 'AMAP_CONFIGURED', amapKey ? 'true' : 'false'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { compose true; buildConfig true }
    signingConfigs {
        if(signingFile.exists()) {
            release {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.qa' }
        release { minifyEnabled false; if(signingFile.exists()) signingConfig signingConfigs.release }
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.000_sea9.8.1'
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation-graphics'
    implementation 'dev.chrisbanes.haze:haze:2.0.0'
    implementation 'dev.chrisbanes.haze:haze-glass:2.0.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.2'
    implementation 'androidx.savedstate:savedstate:1.3.1'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
